services:
  telegram-stremio:
    build: .
    container_name: tg_stremio  
    ports:
      - "8000:8000"
    volumes:
      - ./config.env:/app/config.env
    restart: unless-stopped
    mem_limit: 850m   # 1 GB host: a container OOM restart beats the kernel killing random processes
    logging:
      driver: "json-file"
      options:
        max-size: "1m"     
        max-file: "3"      